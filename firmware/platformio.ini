[env:gmt154-06]
; GMT154-06 / 1.54-inch square ST7789, ESP32-S3 N16R8.
; LCD CSX is hard-wired to ground; do not add a display CS or another SPI
; peripheral in this environment. GPIO2 is an independent active-low
; backlight control: high before panel init, low after the first clear.
upload_speed = ${common_env_data.upload_speed}
monitor_speed = ${common_env_data.monitor_speed}
framework = arduino
platform = ${common_env_data.platform3}
extra_scripts =
	pre:script/board.py
	pre:script/patch_tft_espi_gmt154.py
	pre:script/patch_espframework_gmt154_logging.py
	pre:script/patch_espframework_gmt154_wifi_scan.py
	pre:script/patch_espframework_gmt154_runtime.py
build_unflags = ${common_env_data.build_unflags}
build_flags =
	${gmt154_env_data.build_flags}
	-D CFG_FILENAMEBIN="\"firmware-gmt154-06.bin\""
lib_deps =
	${common_env_data.lib_deps}
	${common_env_data.lib_deps_tft}
lib_ignore =
	mpu6050
board = gmt154_06
board_build.variants_dir = boards
build_type = release
board_build.filesystem = littlefs
board_build.partitions = part32_16mb_coredump.csv
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles = ${common_env_data.html_files}

[env:gmt154-06-c3]
; GMT154-06 C3 / 1.54-inch square ST7789, ESP32-C3, 4 MB flash.
; The pin map and active-low backlight follow the C3 board schematic.
upload_speed = ${common_env_data.upload_speed}
monitor_speed = ${common_env_data.monitor_speed}
framework = arduino
platform = ${common_env_data.platform3}
extra_scripts =
	pre:script/board.py
	pre:script/patch_tft_espi_gmt154_c3.py
	pre:script/patch_espframework_gmt154_c3_single_app.py
	pre:script/patch_gravitymon_gmt154_c3_config_save.py
	pre:script/patch_nimble_gmt154_c3_connection_budget.py
build_unflags =
	-D CONFIG_ASYNC_TCP_RUNNING_CORE=1
	-D MAX_SKETCH_SPACE=0x640000
	-D LV_MEM_SIZE=32*1024
build_flags =
	${common_env_data.build_flags}
	${common_env_data.build_flags_lvgl}
	-D LV_MEM_SIZE=24*1024
	-D ESP32C3=1
	-D ENABLE_TFT=1
	-D LOG_LEVEL=5
	-D LCD_TFT=1
	-D USER_SETUP_LOADED=1
	-D LV_USE_FONT_COMPRESSED=1
	-D GMT154_06=1
	-D GMT154_06_C3=1
	-D ST7789_2_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=240
	-D SMOOTH_FONT=1
	-D LOAD_GFXFF=1
	-D TOUCH_CS=-1
	-D TFT_DC=2
	-D TFT_MISO=-1
	-D TFT_MOSI=5
	-D TFT_SCLK=3
	-D TFT_RST=6
	-D TFT_CS=-1
	-D TFT_SPI_MODE=SPI_MODE3
	-D SPI_FREQUENCY=20000000
	-D GMT154_06_BACKLIGHT_PIN=1
	-D CONFIG_ASYNC_TCP_RUNNING_CORE=0
	-D MAX_SKETCH_SPACE=0x380000
	-D CFG_FILENAMEBIN="\"firmware-gmt154-06-c3.bin\""
lib_deps =
	${common_env_data.lib_deps}
	${common_env_data.lib_deps_tft}
lib_ignore =
	mpu6050
	; No CST touch controller or ES8311 codec is fitted on this target.
	cst328
	cst3530
	es8311
board = gmt154_06_c3
build_type = release
board_build.filesystem = littlefs
board_build.partitions = part32_gmt154_c3_single_app.csv
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles = ${common_env_data.html_files}

[env:gmt154-06-c3-mdns-off]
; Diagnostic build only: disable mDNS registration while retaining C3 features.
extends = env:gmt154-06-c3
extra_scripts =
	${env:gmt154-06-c3.extra_scripts}
	pre:script/patch_espframework_gmt154_c3_mdns_off.py
build_flags =
	${env:gmt154-06-c3.build_flags}
	-D GMT154_C3_MDNS_OFF_DIAG=1

[env:gmt154-06-c3-mdns-off-ble-init-off]
; Diagnostic control: same C3 image as mDNS-off with only BLE initialization skipped.
extends = env:gmt154-06-c3-mdns-off
build_flags =
	${env:gmt154-06-c3-mdns-off.build_flags}
	-D GMT154_06_BLE_INIT_OFF_DIAG=1

[env:gmt154-06-c3-mdns-off-ble-stage-diag]
; Observe BLE initialization heap stages while preserving BLE and scan behavior.
extends = env:gmt154-06-c3-mdns-off
build_flags =
	${env:gmt154-06-c3-mdns-off.build_flags}
	-D GMT154_C3_BLE_STAGE_DIAG=1

[env:gmt154-06-c3-ble-profile-act3]
; Same phase ledger as act1; only the controller activity budget differs.
extends = env:gmt154-06-c3
extra_scripts =
    ${env:gmt154-06-c3.extra_scripts}
    pre:script/patch_nimble_gmt154_c3_ble_memory_profile.py
build_flags =
    ${env:gmt154-06-c3.build_flags}
    -D GMT154_C3_BLE_MEMORY_PROFILE=1
    -D GMT154_C3_BLE_STAGE_DIAG=1
    -D GMT154_C3_BLE_CONTROLLER_ACTIVITIES=3

[env:gmt154-06-c3-ble-profile-act1]
extends = env:gmt154-06-c3
extra_scripts =
    ${env:gmt154-06-c3.extra_scripts}
    pre:script/patch_nimble_gmt154_c3_ble_memory_profile.py
build_flags =
    ${env:gmt154-06-c3.build_flags}
    -D GMT154_C3_BLE_MEMORY_PROFILE=1
    -D GMT154_C3_BLE_STAGE_DIAG=1
    -D GMT154_C3_BLE_CONTROLLER_ACTIVITIES=1
