; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
lib_dir = lib
include_dir = lib

[common_env_data]
; upload_speed = 921600
upload_speed = 460800
monitor_speed =  115200
; ESP32 - Arduino 2.x
platform2 = espressif32@6.11.0 # Arduino 2.x
; ESP32 - Arduino 3.x
platform3 = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
; platform3 = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
; platform3 = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip # Arduino 3.x
build_unflags = 
build_flags = 
	-Wl,-Map,output.map
	-D BAUD=${common_env_data.monitor_speed}
	-D USE_LITTLEFS=true
	-D GATEWAY=1
	-D CFG_APPNAME="\"gravitymon-gw\""
	-D CFG_APPVER="\"0.9.0\""
	; -D CFG_GITREV=\""dev-1\""
	!python script/git_rev.py 
	-D MAX_SKETCH_SPACE=0x640000
	-D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000   ; (keep default)
	-D CONFIG_ASYNC_TCP_PRIORITY=10         ; (keep default)
	-D CONFIG_ASYNC_TCP_QUEUE_SIZE=64       ; (keep default)
	-D CONFIG_ASYNC_TCP_RUNNING_CORE=1      ; force async_tcp task to be on same core as Arduino app (default is any core)
	-D CONFIG_ASYNC_TCP_STACK_SIZE=12288    ; reduce the stack size (default is 16K)
	; -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
build_flags_lvgl = 
	-D LV_CONF_SKIP=1
	-D LV_USE_LOG=1
	-D LV_USE_TFT_ESPI=1
	-D LV_FONT_MONTSERRAT_12=1
	-D LV_FONT_MONTSERRAT_14=1
	-D LV_FONT_MONTSERRAT_16=1
	-D LV_FONT_MONTSERRAT_20=1
	-D LV_FONT_MONTSERRAT_28=1
	-D LV_FONT_MONTSERRAT_40=1
	-D LV_CONF_INCLUDE_SIMPLE=1
	-D LV_MEM_SIZE=32*1024
	-D LV_USE_GESTURE=1
	-D ENABLE_LVGL=1
build_flags_lvgl_gateway35 =
	-D LV_CONF_SKIP=1
	-D LV_USE_LOG=1
	-D LV_USE_FONT_COMPRESSED=1
	-D LV_FONT_MONTSERRAT_12=1
	-D LV_FONT_MONTSERRAT_14=1
	-D LV_FONT_MONTSERRAT_16=1
	-D LV_FONT_MONTSERRAT_20=1
	-D LV_FONT_MONTSERRAT_28=1
	-D LV_FONT_MONTSERRAT_40=1
	-D LV_FONT_MONTSERRAT_48=1
	-D LV_CONF_INCLUDE_SIMPLE=1
	-D LV_MEM_SIZE=32*1024
	-D LV_USE_GESTURE=1
	-D LV_COLOR_DEPTH=16
	-D ENABLE_LVGL=1
lib_deps_tft =
	https://github.com/Bodmer/TFT_eSPI#V2.5.43
	https://github.com/lvgl/lvgl#v9.4.0
	SPI
lib_deps =
	https://github.com/mp-se/espframework#1.2.12
	https://github.com/mp-se/gravitymon#v2.4.0-dev1
    https://github.com/bblanchon/ArduinoJson#v7.4.2
    https://github.com/256dpi/arduino-mqtt#v2.5.2
	https://github.com/ESP32Async/ESPAsyncWebServer#v3.9.3
	https://github.com/pstolarz/OneWireNg#0.14.1
    https://github.com/pstolarz/Arduino-Temperature-Control-Library.git#d2d70abe03299650b860e8ef74d7322d3f305cad
	https://github.com/h2zero/NimBLE-Arduino#2.3.7
	https://github.com/ESP32Async/AsyncTCP#v3.4.9
extra_scripts =  
	pre:script/board.py 
	script/copy_firmware.py
	script/create_versionjson.py
html_files = 
	html/index.html
	html/app.js.gz
	html/app.css.gz
	html/favicon.ico.gz

[env:gateway32-unit]
upload_speed = ${common_env_data.upload_speed}
monitor_speed = ${common_env_data.monitor_speed}
framework = arduino
platform = ${common_env_data.platform2}
extra_scripts = ${common_env_data.extra_scripts}
build_unflags = ${common_env_data.build_unflags}
build_flags = 
	${common_env_data.build_flags}
	-D LOG_LEVEL=5
	-D PIN_VOLT=10
	-D ESP32C3=1
	-D GATEWAY=1
	-D CFG_FILENAMEBIN="\"firmware-unit.bin\""
	-D ESPFWK_DISABLE_WEBSERVER=1
	-D ESPFWK_DISABLE_WIFI=1
lib_deps = 
	https://github.com/bxparks/AUnit#v1.7.1
	${common_env_data.lib_deps}
lib_ignore =
	WiFi
	ESPAsyncWebServer
	AsyncTCP
	ESPmDNS
	WiFiClientSecure
	HTTPClient
	HTTPUpdate
	DNSServer
board = lolin_c3_mini
build_type = release
board_build.filesystem = littlefs
build_src_filter = +<*> -<main_gateway.cpp> +<../test/tests*.cpp> -<web_gateway.cpp> -<push_gateway.cpp>
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles = ${common_env_data.html_files}

[env:gmt154-06-headless-diag]
; GMT154-06 headless diagnostics: keep the board identity and filesystem,
; but omit the TFT/LVGL runtime path. LV_CONF_SKIP only keeps unconditional
; generated font sources compatible with the bundled lvgl.h header.
upload_speed = ${common_env_data.upload_speed}
monitor_speed = ${common_env_data.monitor_speed}
framework = arduino
platform = ${common_env_data.platform3}
extra_scripts =
	pre:script/board.py
build_unflags = ${common_env_data.build_unflags}
build_flags =
	${common_env_data.build_flags}
	-D LV_CONF_SKIP=1
	-D LOG_LEVEL=5
	-D ESP32S3=1
	-D GMT154_06=1
	-D CFG_FILENAMEBIN="\"firmware-gmt154-06-headless-diag.bin\""
lib_deps =
	${common_env_data.lib_deps}
	${common_env_data.lib_deps_tft}
lib_ignore =
	mpu6050
board = gmt154_06
board_build.variants_dir = boards
build_type = release
board_build.filesystem = littlefs
board_build.partitions = part32_16mb_coredump.csv
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles = ${common_env_data.html_files}

[env:gmt154-06-c2b-diag]
; C2b inherits the complete GMT154 target (including the web UI) and adds only
; the I2S standard-mode initialization diagnostic.
extends = env:gmt154-06
extra_scripts =
	pre:script/board.py
	pre:script/patch_tft_espi_gmt154.py
	pre:script/patch_espframework_gmt154_logging.py
	pre:script/patch_espframework_gmt154_wifi_scan.py
build_flags =
	${env:gmt154-06.build_flags}
	-D GMT154_AUDIO_STD_INIT_DIAG=1
	-D CFG_FILENAMEBIN="\"firmware-gmt154-06-c2b-diag.bin\""

[env:gmt154-06-wifi-scan-diag]
extends = env:gmt154-06
extra_scripts =
	pre:script/board.py
	pre:script/patch_espframework_gmt154_logging.py
	pre:script/patch_espframework_gmt154_wifi_scan.py
	pre:script/patch_espframework_gmt154_wifi_scan_diag.py
build_flags =
	${env:gmt154-06.build_flags}
	-D GMT154_WIFI_SCAN_DIAG=1

[env:gmt154-06-sync-wifi-scan-diag]
; Current-source GMT154 diagnostic: retains espframework's synchronous web scan.
; This is not a reproduction of the 2026-10-09 binary.
extends = env:gmt154-06
extra_scripts =
	pre:script/board.py
	pre:script/patch_tft_espi_gmt154.py
	pre:script/patch_espframework_gmt154_logging.py
	pre:script/patch_espframework_gmt154_sync_wifi_diag.py
build_flags =
	${gmt154_env_data.build_flags}
	-D CFG_FILENAMEBIN="\"firmware-gmt154-06-sync-wifi-scan-diag.bin\""

[env:gmt154-06-sync-wifi-scan-diag-ble-init-off]
; Isolated BLE-init diagnostic over the synchronous Wi-Fi scan baseline.
extends = env:gmt154-06-sync-wifi-scan-diag
build_flags =
	${gmt154_env_data.build_flags}
	-D GMT154_06_BLE_INIT_OFF_DIAG=1
	-D CFG_FILENAMEBIN="\"firmware-gmt154-06-sync-wifi-scan-diag-ble-init-off.bin\""

[env:gmt154-06-c2c-diag]
; C2c continues C2b through one measured I2S channel enable; playback remains unavailable.
extends = env:gmt154-06
extra_scripts =
	pre:script/board.py
	pre:script/patch_tft_espi_gmt154.py
	pre:script/patch_espframework_gmt154_logging.py
	pre:script/patch_espframework_gmt154_wifi_scan.py
build_flags =
	${env:gmt154-06.build_flags}
	-D GMT154_AUDIO_STD_ENABLE_DIAG=1
	-D CFG_FILENAMEBIN="\"firmware-gmt154-06-c2c-diag.bin\""

